name: Approved issue check

# Closes pull requests from new contributors that don't link an open issue
# labeled `approved` by a human owner or maintainer (see CONTRIBUTING.md).
#
# pull_request_target runs this workflow from main with a write token, so it
# can comment and close PRs from forks. It never checks out or runs PR code.

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # new contributor = no merged PR in this repository; bots are exempt
    if: >-
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER","NONE"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "approved";
            const MESSAGE = "PR does not address an approved open issue.";
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;

            // issue numbers referenced in the PR description: #N or full issue URLs
            const body = pr.body || "";
            const refs = new Set();
            for (const m of body.matchAll(/(?:^|[^\w&])#(\d+)\b/g)) refs.add(Number(m[1]));
            const url = new RegExp(`github\\.com/${owner}/${repo}/issues/(\\d+)`, "gi");
            for (const m of body.matchAll(url)) refs.add(Number(m[1]));

            // an issue is approved if it is open, carries the label, and the
            // label was last added by a human with write, maintain, or admin access
            async function approved(number) {
              let issue;
              try {
                issue = (await github.rest.issues.get({owner, repo, issue_number: number})).data;
              } catch (e) { return false; }
              if (issue.pull_request || issue.state !== "open") return false;
              if (!issue.labels.some(l => (typeof l === "string" ? l : l.name) === LABEL)) return false;
              const events = await github.paginate(github.rest.issues.listEvents,
                {owner, repo, issue_number: number, per_page: 100});
              const added = events.filter(e => e.event === "labeled" && e.label && e.label.name === LABEL).pop();
              if (!added || !added.actor || added.actor.type === "Bot") return false;
              const perm = (await github.rest.repos.getCollaboratorPermissionLevel(
                {owner, repo, username: added.actor.login})).data.permission;
              return ["admin", "maintain", "write"].includes(perm);
            }

            for (const number of refs) {
              if (await approved(number)) {
                core.info(`PR #${pr.number} addresses approved issue #${number}`);
                return;
              }
            }

            core.info(`Closing PR #${pr.number}: no approved open issue referenced`);
            await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body: MESSAGE});
            await github.rest.pulls.update({owner, repo, pull_number: pr.number, state: "closed"});
