[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
loads = ["*.py", "skill/*.md", "skill/reference/*.md", "wecc/county_mwh.csv", "wecc/county_dg.csv.gz"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "loads"
version = "0.0.0"
description = "US electric load model"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = "== 3.12.*"
keywords = ["github","python","US","electricity","load","demand","model"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic=["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/loads"
Documentation = "https://www.eudoxys.com/loads"
Repository = "https://github.com/eudoxys/loads.git"
Issues = "https://github.com/eudoxys/loads/issues"

[tool.pytest.ini_options]
testpaths = ["loads/_test"]
markers = [
    "network: downloads NREL, Census, and NSRDB data (slow on an empty cache)",
    ]

[project.scripts]
loads = "loads.cli:main"
